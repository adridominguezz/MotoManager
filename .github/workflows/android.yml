# Builds the Android APK with Unity (GameCI) and, on a version tag (v0.2.0...), publishes it as a GitHub Release
# so anyone can download and install it. Needs the repository secrets UNITY_LICENSE, UNITY_EMAIL and
# UNITY_PASSWORD; ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS and ANDROID_KEY_PASS are
# optional (without them the APK is signed with a debug key). See docs/RELEASES.md.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > motomanager.keystore
            echo "path=motomanager.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "path=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: MotoManager.EditorTools.BuildScript.BuildAndroid
          customParameters: >-
            -mmVersion ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
            -mmVersionCode ${{ github.run_number }}
            -mmKeystore ${{ steps.key.outputs.path }}
            -mmKeystorePass ${{ secrets.ANDROID_KEYSTORE_PASS || 'none' }}
            -mmKeyAlias ${{ secrets.ANDROID_KEY_ALIAS || 'none' }}
            -mmKeyPass ${{ secrets.ANDROID_KEY_PASS || 'none' }}

      - name: Name the APK
        run: sudo mv Builds/Android/MotoManager.apk "Builds/Android/MotoManager-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MotoManager-apk
          path: Builds/Android/*.apk

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Builds/Android/*.apk
          body: |
            APK de MotoManager para Android (ARM64, Android 7.0 o superior).
            Instalación: descarga el `.apk` en el móvil, ábrelo y permite "instalar apps de origen desconocido".
            Uso personal y no comercial ([licencia](https://github.com/${{ github.repository }}/blob/HEAD/LICENSE)). Proyecto de fans no oficial.
